services:
  postgres:
    image: postgres:16-alpine
    container_name: vitrine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitrine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vitrine-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-config:
    image: minio/mc:latest
    container_name: vitrine-minio-config
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-vitrine-bucket} &&
      mc anonymous set download local/${MINIO_BUCKET_NAME:-vitrine-bucket}
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: vitrine-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vitrine
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_PATH: /data/storage
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:3001}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-vitrine-bucket}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:3002}
      LOG_LEVEL: info
      LOGTAIL_TOKEN: ${LOGTAIL_TOKEN:-}
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-config:
        condition: service_completed_successfully
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: vitrine-backoffice
    environment:
      PORT: 3002
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  storage_data:
