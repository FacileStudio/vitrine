[env]
_.file = ".env"

[tasks.dev]
description = "Start the backend dev server"
depends = ["//:install", "//packages/database:generate"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run dev'

[tasks.build]
description = "Build the backend"
depends = ["//:install", "//packages/database:generate"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run build'

[tasks.start]
description = "Start the built backend"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run start'

[tasks.typecheck]
description = "Typecheck the backend"
depends = ["//:install", "//packages/database:generate"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run typecheck'

[tasks.lint]
description = "Lint the backend"
depends = ["//:install", "//packages/database:generate"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run lint'

[tasks."check-env"]
description = "Validate backend environment variables"
depends = ["//:install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run check-env'

[tasks.check]
description = "Validate env, lint, and typecheck the backend"
depends = ["//:install", "//packages/database:generate"]
run = [
  'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run check-env',
  'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run lint',
  'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run typecheck',
]
