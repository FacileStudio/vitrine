map $http_accept_language $fc_accept_raw {
    default en;
    "~*(?:^|,)[ \t]*(fr|en|es|de)(?![a-z])" $1;
}

map $fc_accept_raw $fc_accept {
    default en;
    ~*^fr$ fr;
    ~*^es$ es;
    ~*^de$ de;
}

map $http_user_agent $fc_fallback {
    default $fc_accept;
    "~*(bot|crawl|spider|slurp|facebookexternalhit|whatsapp|telegram|embedly|preview|skype|pinterest)" fr;
}

map $cookie_fc_locale $fc_want {
    default $fc_fallback;
    fr fr;
    en en;
    es es;
    de de;
}

server {
    listen 3012;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;

    location = / {
        add_header Vary "Accept-Language, Cookie, User-Agent" always;
        add_header Cache-Control "no-cache" always;
        if ($fc_want != fr) {
            return 302 /$fc_want$is_args$args;
        }
        try_files /index.html =404;
    }

    location ~ ^/(contact|projects(/[^/.]+)?)/?$ {
        add_header Vary "Accept-Language, Cookie, User-Agent" always;
        if ($fc_want != fr) {
            return 302 /$fc_want$uri$is_args$args;
        }
        try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ ^/(fr|en)/studio/?$ {
        return 301 /;
    }

    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /models/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;
}
