<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Icons & Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Canonical & SEO -->
    <link rel="canonical" href="https://facile.studio/" />
    <meta name="description" content="Facile. Studio - Agence digitale créative spécialisée dans le design et le développement web" />
    <meta name="keywords" content="design, développement web, studio créatif, agence digitale, UX/UI, Svelte, Go, hébergement souverain" />
    <meta name="author" content="Facile. Studio" />
    <meta name="creator" content="Facile. Studio" />
    <meta name="publisher" content="Facile. Studio" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://facile.studio/" />
    <meta property="og:site_name" content="Facile. Studio" />
    <meta property="og:title" content="Facile Studio - Design, branding et développement web" />
    <meta property="og:description" content="Facile. Studio - Agence digitale créative spécialisée dans le design et le développement web" />
    <meta property="og:image" content="https://facile.studio/images/og.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Facile. Studio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@facilestudio" />
    <meta name="twitter:creator" content="@facilestudio" />
    <meta name="twitter:title" content="Facile Studio - Design, branding et développement web" />
    <meta name="twitter:description" content="Facile. Studio - Agence digitale créative spécialisée dans le design et le développement web" />
    <meta name="twitter:image" content="https://facile.studio/images/og.webp" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://facile.studio/#organization",
            "name": "Facile Studio",
            "url": "https://facile.studio",
            "logo": "https://facile.studio/F.svg",
            "sameAs": [
              "https://github.com/FacileStudio",
              "https://www.dribbble.com/webbygian",
              "https://www.instagram.com/webbygian"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+33768888818",
              "contactType": "customer service",
              "email": "contact@facile.studio",
              "url": "https://facile.studio"
            },
            "founders": [
              {
                "@type": "Person",
                "name": "Yann Thevenin",
                "jobTitle": "Lead Developer & Co-Founder"
              },
              {
                "@type": "Person",
                "name": "Noah Steiniger",
                "jobTitle": "UI/Web Designer & Co-Founder"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://facile.studio/#website",
            "name": "Facile Studio",
            "url": "https://facile.studio",
            "inLanguage": ["fr", "en"]
          }
        ]
      }
    </script>

    %sveltekit.head%
  </head>
  <body class="bg-fc-page text-fc-fg antialiased selection:bg-fc-accent selection:text-fc-accent-fg">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
