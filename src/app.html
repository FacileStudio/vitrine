<!doctype html>
<html lang="%lang%" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facile" />
    <meta property="og:image" content="https://facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@facilestudio" />
    <meta name="twitter:creator" content="@facilestudio" />
    <meta name="twitter:image" content="https://facile.studio/og-image.png" />

    <meta name="author" content="Facile Studio" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://facile.studio/#organization",
            "name": "Facile Studio",
            "url": "https://facile.studio",
            "logo": "https://facile.studio/icon-512.png",
            "sameAs": [
              "https://github.com/FacileStudio",
              "https://www.dribbble.com/webbygian",
              "https://www.instagram.com/webbygian"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+33768888818",
              "contactType": "customer service",
              "email": "contact@facile.studio",
              "url": "https://facile.studio"
            },
            "founder": [
              {
                "@type": "Person",
                "name": "Yann Thevenin",
                "jobTitle": "Lead Developer & Co-Founder"
              },
              {
                "@type": "Person",
                "name": "Noah Steiniger",
                "jobTitle": "UI/Web Designer & Co-Founder"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://facile.studio/#website",
            "name": "Facile Studio",
            "url": "https://facile.studio",
            "inLanguage": "fr"
          }
        ]
      }
    </script>

    %sveltekit.head%
  </head>
  <body class="bg-fc-page text-fc-fg antialiased selection:bg-fc-accent selection:text-fc-accent-fg">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
