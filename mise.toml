[tools]
node = "22"
bun = "latest"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Start the Next.js dev server"
run = "bun run dev"

[tasks.build]
description = "Create a production build"
run = "bun run build"

[tasks.start]
description = "Serve the production build"
run = "bun run start"

[tasks.lint]
description = "Lint with ESLint"
run = "bun run lint"
