monorepo_root = true

[settings]
experimental = true
lockfile = true

[monorepo]
config_roots = ["apps/*"]

[tools]
bun = "1.2.0"
node = "22.22.1"

[env]
BUN_BIN = { value = "{{tools.bun.path}}/bin/bun", tools = true }
NODE_BIN_DIR = { value = "{{tools.node.path}}/bin", tools = true }

[tasks.install]
description = "Install workspace dependencies with Bun"
sources = ["bun.lock", "package.json", "apps/*/package.json", "packages/*/package.json"]
outputs = ["node_modules"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" install --frozen-lockfile'

[tasks.dev]
description = "Run all app dev servers via Turbo"
depends = [":install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run dev'

[tasks.build]
description = "Build the monorepo"
depends = [":install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run build'

[tasks.lint]
description = "Lint the monorepo"
depends = [":install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run lint'

[tasks.typecheck]
description = "Typecheck the monorepo"
depends = [":install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run typecheck'

[tasks.check]
description = "Run lint and typecheck across the monorepo"
depends = [":install"]
run = [
  'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run lint',
  'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run typecheck',
]

[tasks.format]
description = "Format repository files"
depends = [":install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run format'

[tasks.clean]
description = "Clean build outputs and root node_modules"
depends = [":install"]
run = 'PATH="$NODE_BIN_DIR:$PATH" "$BUN_BIN" run clean'

[tasks."db:up"]
description = "Start the repo-local Postgres dev database and sync DATABASE_URL"
tools = { "asdf:mise-plugins/mise-postgres" = "14.22" }
run = "./scripts/db-up.sh"

[tasks."db:down"]
description = "Stop the repo-local Postgres dev database"
tools = { "asdf:mise-plugins/mise-postgres" = "14.22" }
run = "./scripts/db-down.sh"

[tasks.minio]
description = "Start the repo-local MinIO server"
tools = { "asdf:mise-plugins/mise-minio" = "2025-09-07T16-13-09Z" }
run = "./scripts/minio.sh"

[tasks."minio:config"]
description = "Configure the repo-local MinIO instance and bucket"
tools = { "aqua:minio/mc" = "RELEASE.2025-08-13T08-35-41Z" }
run = "./scripts/minio-config.sh"
